{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-12">
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: var(--primary);">Join NexaMart</h2>
            <p class="text-muted">Create your free account</p>
        </div>
        
        <div class="modern-card p-4">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control" id="username">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="email">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password">
            </div>

            <div id="error-msg" class="alert alert-danger py-2" style="display: none; border-radius: 12px;"></div>

            <button class="btn btn-primary w-100 py-3 fw-bold" onclick="doRegister()">Create Account</button>
            
            <p class="text-center mt-4 mb-0 text-muted">
                Already have an account? <a href="/login/" class="fw-bold" style="color: var(--primary); text-decoration: none;">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    function doRegister() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');
        const btn = document.querySelector('button[onclick="doRegister()"]');

        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating...';
        btn.disabled = true;
        errorMsg.style.display = 'none';

        fetch('/api/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify({ username: username, email: email, password: password, role: 'customer' })
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                window.location.href = '/login/'; 
            } else {
                let errText = ''; for (let key in data) { errText += `${key}: ${data[key]} `; }
                errorMsg.innerText = errText || 'Registration failed';
                errorMsg.style.display = 'block';
                btn.innerHTML = 'Create Account';
                btn.disabled = false;
            }
        })
        .catch(err => {
            errorMsg.innerText = 'Network error';
            errorMsg.style.display = 'block';
            btn.innerHTML = 'Create Account';
            btn.disabled = false;
        });
    }
</script>
{% endblock %}

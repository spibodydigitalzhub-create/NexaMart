<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexaMart</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NexaMart">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/pPQgPzH.jpeg">
    <link rel="apple-touch-icon" href="https://i.imgur.com/pPQgPzH.jpeg">
    
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-color: #f9fafb;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --success: #10b981;
            --border-radius: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, h4, h5, h6, .navbar-brand { font-family: 'Poppins', sans-serif; }

        .top-header {
            background: var(--surface);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-logo { 
            color: var(--primary); 
            font-weight: 700; 
            font-size: 1.4rem; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .brand-logo img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }
        .brand-logo span {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-icon { color: var(--text-main); font-size: 1.3rem; text-decoration: none; position: relative; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--surface); border-top: 1px solid #f3f4f6;
            display: flex; justify-content: space-around; padding: 10px 0 15px 0;
            z-index: 1000; box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
        }
        .nav-item-custom {
            text-decoration: none; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.75rem; font-weight: 500; transition: all 0.2s;
        }
        .nav-item-custom i { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item-custom.active, .nav-item-custom:hover { color: var(--primary); }

        .modern-card {
            background: var(--surface); border: none; border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; overflow: hidden;
        }
        .modern-card:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); border: none; border-radius: 12px; font-weight: 600; padding: 10px 20px; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-success { background-color: var(--success); border: none; border-radius: 12px; font-weight: 600; }
        .form-control, .form-select { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; background-color: #f9fafb; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); background-color: #fff; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .premium-footer {
            background-color: #111827;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            margin-top: 60px;
            padding: 40px 20px 20px 20px;
        }
        .premium-footer a:hover { color: #fff !important; }
        .premium-footer .footer-logo img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }
        
        /* Install Button */
        #install-btn {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>

    <!-- Install Prompt Button -->
    <button id="install-btn" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">
        <i class="bi bi-download me-2"></i> Install NexaMart App
    </button>

    <!-- Top Header -->
    <div class="top-header">
        <a href="/" class="brand-logo">
            <img src="https://i.imgur.com/pPQgPzH.jpeg" alt="NexaMart">
            <span>NexaMart</span>
        </a>
        <div class="d-flex gap-3">
            <a href="/my-orders/" class="header-icon"><i class="bi bi-bell"></i></a>
            <a href="/login/" class="header-icon"><i class="bi bi-person-circle"></i></a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Premium Footer -->
    <footer class="premium-footer">
        <div class="row g-4">
            <div class="col-12 text-center">
                <div class="footer-logo mb-2">
                    <img src="https://i.imgur.com/pPQgPzH.jpeg" alt="NexaMart" style="filter: brightness(0) invert(1);">
                </div>
                <p class="text-secondary small mb-0">The ultimate marketplace for buyers and sellers in Ghana.</p>
            </div>
            <div class="col-6">
                <h6 class="text-white fw-semibold mb-3">Explore</h6>
                <ul class="list-unstyled small">
                    <li class="mb-2"><a href="/" class="text-secondary text-decoration-none">Home</a></li>
                    <li class="mb-2"><a href="/become-a-vendor/" class="text-secondary text-decoration-none">Sell on NexaMart</a></li>
                </ul>
            </div>
            <div class="col-6">
                <h6 class="text-white fw-semibold mb-3">Support</h6>
                <ul class="list-unstyled small">
                    <li class="mb-2"><a href="#" class="text-secondary text-decoration-none">Help Center</a></li>
                    <li class="mb-2">
                        <a href="https://wa.me/233257210750" class="text-secondary text-decoration-none d-flex align-items-center gap-2">
                            <i class="bi bi-whatsapp text-success" style="font-size: 1.1rem;"></i> Chat on WhatsApp
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <hr class="border-secondary my-4 opacity-25">
        <div class="text-center">
            <p class="text-secondary small mb-0">&copy; 2026 NexaMart. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="/" class="nav-item-custom active"><i class="bi bi-house-door"></i> Home</a>
        <a href="/become-a-vendor/" class="nav-item-custom"><i class="bi bi-shop"></i> Sell</a>
        <a href="/cart/" class="nav-item-custom position-relative">
            <i class="bi bi-cart3"></i> Cart
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count" style="font-size: 0.6rem;">0</span>
        </a>
        <a href="/login/" class="nav-item-custom"><i class="bi bi-person"></i> Account</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Cart Badge Logic
        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('nexamart_cart') || '[]');
            let count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = count;
        }
        updateCartBadge();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(registration => console.log('SW registered:', registration))
                    .catch(error => console.log('SW registration failed:', error));
            });
        }

        // PWA Install Prompt Logic
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
    {% block scripts %}
    {% endblock %}
</body>
</html>

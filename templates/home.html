{% extends 'base.html' %}

{% block content %}
    <!-- Search Bar -->
    <div class="mb-4">
        <div class="modern-card p-2 d-flex align-items-center">
            <span class="ps-3 pe-2"><i class="bi bi-search text-muted fs-5"></i></span>
            <input type="text" class="form-control border-0 bg-transparent shadow-none px-0" id="search-input" placeholder="Search for products, brands...">
            <button class="btn btn-primary btn-sm rounded-pill px-3 me-1" type="button" onclick="searchProducts()">Search</button>
        </div>
    </div>

    <!-- Premium Categories Slider -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Shop by Category</h5>
    </div>
    <div class="d-flex overflow-auto mb-4 pb-2 hide-scrollbar gap-3" id="category-list">
        <!-- Categories injected here -->
    </div>

    <!-- Products Grid -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Trending Now</h5>
        <a href="#" class="text-decoration-none" style="color: var(--primary); font-size: 0.9rem; font-weight: 600;">See all</a>
    </div>
    
    <div class="row g-3" id="product-list">
        <div class="col-12 text-center mt-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    let currentCategory = '';
    let currentSearch = '';

    fetch('/api/categories/')
        .then(res => res.json())
        .then(cats => {
            const container = document.getElementById('category-list');
            let html = `
                <button class="modern-card d-flex flex-column align-items-center justify-content-center p-3 text-decoration-none active-cat" style="min-width: 80px; height: 90px; cursor: pointer; border: 2px solid var(--primary);" onclick="filterCategory('', this)">
                    <i class="bi bi-grid-fill fs-4 mb-1" style="color: var(--primary);"></i>
                    <span class="small fw-bold" style="font-size: 0.7rem; color: var(--primary);">All</span>
                </button>
            `;
            if (cats.length === 0) {
                html += `<p class="text-muted small ms-2">No categories yet. Add them in Admin.</p>`;
            } else {
                cats.forEach(c => {
                    const icon = c.icon || 'bi-tag'; 
                    html += `
                        <button class="modern-card d-flex flex-column align-items-center justify-content-center p-3 text-decoration-none" style="min-width: 80px; height: 90px; cursor: pointer; border: 1px solid #f3f4f6;" onclick="filterCategory('${c.name}', this)">
                            <i class="bi ${icon} fs-4 mb-1 text-muted"></i>
                            <span class="small fw-medium text-muted" style="font-size: 0.7rem;">${c.name}</span>
                        </button>
                    `;
                });
            }
            container.innerHTML = html;
        });

    function loadProducts() {
        let url = '/api/products/?';
        if (currentCategory) url += `category=${currentCategory}&`;
        if (currentSearch) url += `search=${currentSearch}&`;

        fetch(url)
            .then(response => response.json())
            .then(products => {
                const container = document.getElementById('product-list');
                container.innerHTML = ''; 
                if (products.length === 0) { container.innerHTML = '<p class="text-center text-muted mt-4">No products found.</p>'; return; }
                
                products.forEach(product => {
                    // Updated to Ghana Cedi (GH₵)
                    const formattedPrice = 'GH₵' + parseFloat(product.price).toLocaleString();
                    const imageUrl = product.image ? product.image : 'https://via.placeholder.com/300x300?text=NexaMart';
                    
                    let stars = '';
                    const fullStars = Math.floor(product.average_rating || 0);
                    for(let i=0; i<5; i++) stars += i < fullStars ? '<i class="bi bi-star-fill text-warning" style="font-size:0.7rem"></i>' : '<i class="bi bi-star text-muted" style="font-size:0.7rem"></i>';

                    const html = `
                        <div class="col-6">
                            <div class="modern-card h-100 d-flex flex-column" onclick="window.location.href='/product/${product.id}/'" style="cursor: pointer;">
                                <div class="position-relative">
                                    <img src="${imageUrl}" class="w-100" style="height: 160px; object-fit: cover; border-top-left-radius: 16px; border-top-right-radius: 16px;">
                                    <span class="position-absolute top-0 end-0 m-2 badge bg-white text-dark shadow-sm rounded-pill px-2 py-1 d-flex align-items-center gap-1">
                                        ${stars} <small>${product.review_count || 0}</small>
                                    </span>
                                </div>
                                <div class="card-body p-3 d-flex flex-column flex-grow-1">
                                    <h6 class="card-title text-truncate mb-1 fw-semibold" style="font-size: 0.95rem;">${product.name}</h6>
                                    <p class="text-muted small mb-2 text-truncate">${product.vendor_name}</p>
                                    <div class="mt-auto d-flex justify-content-between align-items-center">
                                        <span class="fw-bold" style="color: var(--text-main); font-size: 1.1rem;">${formattedPrice}</span>
                                        <button class="btn btn-primary btn-sm rounded-circle p-2 d-flex align-items-center justify-content-center" 
                                                style="width: 32px; height: 32px;" 
                                                onclick="event.stopPropagation(); addToCart(${product.id}, '${product.name}', ${product.price}, '${imageUrl}')">
                                            <i class="bi bi-plus-lg" style="font-size: 1rem;"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    container.innerHTML += html;
                });
            });
    }

    function addToCart(id, name, price, image) {
        let cart = JSON.parse(localStorage.getItem('nexamart_cart') || '[]');
        let existing = cart.find(item => item.id === id);
        if (existing) { existing.quantity += 1; } 
        else { cart.push({ id: id, name: name, price: price, image: image, quantity: 1 }); }
        localStorage.setItem('nexamart_cart', JSON.stringify(cart));
        updateCartBadge();
        
        const btn = event.target.closest('button');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="bi bi-check-lg"></i>';
        btn.classList.replace('btn-primary', 'btn-success');
        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.classList.replace('btn-success', 'btn-primary');
        }, 1000);
    }

    function filterCategory(catName, btnElement) { 
        currentCategory = catName; 
        document.querySelectorAll('#category-list button').forEach(btn => {
            btn.style.border = '1px solid #f3f4f6';
            btn.querySelector('i').className = btn.querySelector('i').className.replace('text-primary', 'text-muted');
            btn.querySelector('i').className = btn.querySelector('i').className.replace('bi-grid-fill', 'bi-grid'); 
            btn.querySelector('span').style.color = 'var(--text-muted)';
            btn.querySelector('span').classList.replace('fw-bold', 'fw-medium');
        });
        if (btnElement) {
            btnElement.style.border = '2px solid var(--primary)';
            btnElement.querySelector('i').classList.replace('text-muted', 'text-primary');
            btnElement.querySelector('i').classList.replace('bi-grid', 'bi-grid-fill');
            btnElement.querySelector('span').style.color = 'var(--primary)';
            btnElement.querySelector('span').classList.replace('fw-medium', 'fw-bold');
        }
        loadProducts(); 
    }

    function searchProducts() { currentSearch = document.getElementById('search-input').value; loadProducts(); }
    loadProducts();
</script>
{% endblock %}
